# =============================================================
# StayHub V2 - Production Configuration
# =============================================================

# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
logging.level.root=INFO
logging.level.com.uniquindio=INFO

# -------------------------------------------------------------
# Database
# -------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------
# Security / JWT
# -------------------------------------------------------------
JWT.SECRET.KEY=${JWT_SECRET_KEY}
JWT.TIME.EXPIRATION=${JWT_TIME_EXPIRATION}

# -------------------------------------------------------------
# Mail
# -------------------------------------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# -------------------------------------------------------------
# Static Resources
# -------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# -------------------------------------------------------------
# Actuator
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health

# -------------------------------------------------------------
# SpringDoc (disabled in prod)
# -------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# -------------------------------------------------------------
# StayHub Business
# -------------------------------------------------------------
stayhub.frontend.url=${FRONTEND_URL:https://stay-hub-xi.vercel.app}
stayhub.payment.bank-account=${PAYMENT_BANK_ACCOUNT:3001234567890}
stayhub.payment.deposit-percentage=20
stayhub.payment.deadline-days=3