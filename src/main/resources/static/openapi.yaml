openapi: 3.0.3
info:
  title: StayHub V2 API
  version: 1.0.0
  description: Static OpenAPI contract aligned with the currently implemented StayHub V2 controllers.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Users
    description: Authentication and account management endpoints.
  - name: Accommodations
    description: Accommodation creation, search, retrieval and soft delete endpoints.
  - name: Rental Packages
    description: Seasonal pricing packages per accommodation. Each package defines a `pricePerNight` that replaces the accommodation base nightly rate for nights inside the package date range.
  - name: Bookings
    description: Reservation creation and reservation management endpoints.
  - name: Reviews
    description: Guest review creation, review listing and host response endpoints.
  - name: Host metrics
    description: Host performance analytics endpoints by accommodation and stay period.
  - name: Notifications
    description: In-app notifications for pending reservation deposits.
paths:
  /api/v2/users/auth/signup:
    post:
      tags:
        - Users
      summary: Register a new user
      description: Creates a new StayHub user account with one or more roles.
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/login:
    post:
      tags:
        - Users
      summary: Login user
      description: Authenticates a user and returns a JWT access token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/forgot-password:
    post:
      tags:
        - Users
      summary: Forgot password
      description: Generates a recovery code and sends it to the user's email.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Recovery code sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/reset-password:
    post:
      tags:
        - Users
      summary: Reset password
      description: Resets the user's password using a recovery code.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired recovery code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/change-password:
    put:
      tags:
        - Users
      summary: Change password
      description: Changes the password of the authenticated user.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation or business rules error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid current password or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations:
    post:
      tags:
        - Accommodations
      summary: Create accommodation
      description: |
        Creates a new accommodation listing owned by the authenticated host.

        The backend derives the host from the authenticated JWT user and forces:
        - `available = true`
        - `deleted = false`
      operationId: createAccommodation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccommodationRequest'
      responses:
        '201':
          description: Accommodation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccommodationResponse'
        '400':
          description: Validation error or malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed to create accommodations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Accommodations
      summary: Search accommodations by city
      description: Returns active and available accommodations matching the requested city.
      operationId: searchAccommodationsByCity
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: city
          required: true
          description: City name used to filter accommodations.
          schema:
            type: string
            minLength: 1
            example: Armenia
        - in: query
          name: page
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Accommodations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationSearchByCityPage'
        '400':
          description: Invalid city, page or size parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{id}:
    get:
      tags:
        - Accommodations
      summary: Get accommodation by ID
      description: |
        Returns the accommodation detail for an active, non-deleted accommodation.

        Note:
        The current response model exposes the host through an entity-backed nested object,
        so the documented `host` schema mirrors the actual serialized structure in the current codebase.
      operationId: getAccommodation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Accommodation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationGetByIdResponse'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Accommodations
      summary: Deactivate accommodation
      description: Soft deletes an accommodation if it has no future active reservations and the authenticated user is its host owner.
      operationId: deactivateAccommodation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Accommodation deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Active future reservations exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not the owner of the accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{id}/unavailable-dates:
    get:
      tags:
        - Accommodations
      summary: Get unavailable accommodation dates
      description: |
        Returns a paginated list of blocked date ranges for the given accommodation.

        Only reservations with `ACTIVE` status are included because those are the intervals
        that currently make the accommodation unavailable for new bookings.
      operationId: getUnavailableAccommodationDates
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: query
          name: page
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Unavailable dates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableAccommodationDateRangePage'
        '400':
          description: Invalid accommodation ID, page or size parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{accommodationId}/packages:
    post:
      tags:
        - Rental Packages
      summary: Create rental package
      description: |
        Creates a seasonal pricing package for the specified accommodation.

        **Business rules:**
        - Caller must have the HOST role and own the accommodation.
        - The package date range must not overlap any existing package for the same accommodation.
        - The `pricePerNight` replaces the accommodation base `pricePerNight` for each reservation night that falls inside the package range.
        - If a reservation is partially inside and partially outside the package, the backend calculates the total night by night.
      operationId: createRentalPackage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalPackageRequest'
      responses:
        '201':
          description: Package created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPackageResponse'
        '400':
          description: Validation error or invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not the HOST owner of this accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Date range overlaps with an existing package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Rental Packages
      summary: List rental packages
      description: Returns all seasonal pricing packages for the given accommodation ordered by start date. Available to any authenticated user.
      operationId: getRentalPackages
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Packages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalPackageResponse'
        '401':
          description: Unauthorized, valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{accommodationId}/packages/{packageId}:
    put:
      tags:
        - Rental Packages
      summary: Update rental package
      description: |
        Partially updates a seasonal pricing package. Only non-null fields are applied.

        **Business rules:**
        - Caller must have the HOST role and own the accommodation.
        - If dates change, the new range must not overlap any other package in the same accommodation.
      operationId: updateRentalPackage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: path
          name: packageId
          required: true
          description: Rental package identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRentalPackageRequest'
      responses:
        '200':
          description: Package updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPackageResponse'
        '400':
          description: Validation error or invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not the HOST owner of this accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation or package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: New date range overlaps with an existing package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Rental Packages
      summary: Delete rental package
      description: Permanently deletes a seasonal pricing package. Caller must have the HOST role and own the accommodation.
      operationId: deleteRentalPackage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
        - in: path
          name: packageId
          required: true
          description: Rental package identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Package deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized, valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not the HOST owner of this accommodation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation or package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/bookings/book:
    post:
      tags:
        - Bookings
      summary: Create a new accommodation reservation
      description: |
        Creates a reservation for a full accommodation stay.

        Business notes:
        - reservations must be created at least 72 hours before check-in,
        - overlapping active reservations are rejected,
        - the accommodation base `pricePerNight` applies by default,
        - if one or more nights fall inside a seasonal pricing package, those nights use the package `pricePerNight`,
        - if the stay is partially inside and partially outside a package, the backend calculates a mixed total night by night,
        - the response includes the deposit amount, bank account number, payment deadline, and a `rentalPriceModification` summary for the frontend.
      operationId: bookAccommodation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationResponse'
        '400':
          description: Invalid request or reservation policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Accommodation not available for selected dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/bookings/{reservationId}:
    get:
      tags:
        - Bookings
      summary: Get reservation detail by ID
      description: Returns the full detail of a reservation for the guest owner or accommodation host.
      operationId: getReservationById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: Reservation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Reservation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '400':
          description: Invalid reservation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Bookings
      summary: Update an active reservation date range
      description: |
        Updates the check-in and check-out dates of an active reservation owned by the authenticated guest.

        If the new check-in is within the next 72 hours, the deposit must already be paid.
      operationId: updateReservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: Reservation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservationRequest'
      responses:
        '200':
          description: Reservation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '400':
          description: Invalid request or reservation policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the guest can update the reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Dates unavailable or deposit not paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/bookings/{reservationId}/cancel:
    patch:
      tags:
        - Bookings
      summary: Cancel an active reservation
      description: Cancels an active reservation owned by the authenticated guest. Cancellation is allowed only at least 48 hours before check-in.
      operationId: cancelReservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: Reservation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Reservation cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '400':
          description: Reservation cannot be cancelled by policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the guest can cancel the reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/bookings/{reservationId}/deposit-paid:
    patch:
      tags:
        - Bookings
      summary: Mark reservation deposit as paid
      description: Marks the advance deposit as paid for an active reservation owned by the authenticated guest.
      operationId: markDepositAsPaid
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
          description: Reservation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Deposit marked as paid successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationResponse'
        '400':
          description: Reservation is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the guest can mark the deposit as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/bookings/my-reservations:
    get:
      tags:
        - Bookings
      summary: Get paginated list of my reservations
      description: |
        Returns paginated reservations for the authenticated user.

        If `scope` is omitted, legacy behavior is preserved:
        - users with role `HOST` receive host reservations,
        - users without role `HOST` receive guest reservations.
      operationId: getMyReservations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: scope
          required: false
          description: Optional reservation filter scope.
          schema:
            type: string
            enum:
              - host
              - guest
              - all
      responses:
        '200':
          description: Reservations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveReservationSummaryPage'
        '400':
          description: Invalid page or scope parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/accommodations/{accommodationId}/reviews:
    post:
      tags:
        - Reviews
      summary: Create a review for a completed stay
      description: Allows the guest who completed a reservation to create a single review for the related accommodation.
      operationId: createReview
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Review policy violation or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the guest owner can create the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation or reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Reviews
      summary: List reviews for an accommodation
      description: Returns all reviews registered for the specified accommodation ordered from newest to oldest.
      operationId: getAccommodationReviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accommodationId
          required: true
          description: Accommodation identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accommodation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/reviews/{reviewId}/response:
    post:
      tags:
        - Reviews
      summary: Answer a guest review
      description: Allows the host owner of the accommodation to respond once to a guest review.
      operationId: respondToReview
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          description: Review identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondReviewRequest'
      responses:
        '200':
          description: Review answered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Review policy violation or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the host owner can answer the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/hosts/me/accommodations/metrics:
    get:
      tags:
        - Host metrics
      summary: Get accommodation metrics by stay period
      description: |
        Returns paginated performance metrics for accommodations owned by the authenticated host.

        The requested period is evaluated using reservation stay overlap instead of reservation creation time.
      operationId: getAccommodationMetricsByPeriod
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          required: true
          description: Inclusive start date of the requested stay period.
          schema:
            type: string
            format: date
            example: '2026-05-01'
        - in: query
          name: endDate
          required: true
          description: Inclusive end date of the requested stay period.
          schema:
            type: string
            format: date
            example: '2026-05-31'
        - in: query
          name: page
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Host accommodation metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAccommodationMetricsPage'
        '400':
          description: Invalid date range, page or size parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user does not have HOST role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/notifications/payment-pending:
    get:
      tags:
        - Notifications
      summary: Get pending payment notifications
      description: Returns active reservations of the authenticated guest with pending deposit payment and a non-expired payment deadline.
      operationId: getPendingPaymentNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pending payment notifications, which may be empty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentNotification'
        '401':
          description: Unauthorized, valid JWT token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      description: Standard error payload returned by the API.
      properties:
        message:
          type: string
          example: Invalid login attempt detected
        code:
          type: integer
          example: 401
      required:
        - message
        - code

    MessageResponse:
      type: object
      description: Generic response with a single message field.
      properties:
        message:
          type: string
          example: Operation completed successfully
      required:
        - message

    TokenResponse:
      type: object
      description: JWT access token returned after successful authentication.
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIiwiZXhwIjoxNzI1ODk4MDAwfQ.signature
      required:
        - token

    Role:
      type: string
      enum:
        - GUEST
        - HOST

    ReservationStatus:
      type: string
      enum:
        - ACTIVE
        - CANCELLED
        - COMPLETED

    UserSignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john.doe@example.com
        password:
          type: string
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,}$
          example: P@ssw0rd123
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
          example:
            - GUEST
            - HOST
        fullName:
          type: string
          maxLength: 100
          example: John Giggity Doe
        phoneNumber:
          type: string
          pattern: ^\+57\s?\d{10}$
          example: +573101234567
        birthDate:
          type: string
          format: date
          example: '1990-01-01'
        profilePicture:
          type: string
          format: uri
          example: https://example.com/profile.jpg
      required:
        - email
        - password
        - roles
        - fullName
        - phoneNumber
        - birthDate
        - profilePicture

    UserSignupResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john.doe@example.com
        password:
          type: string
          example: P@ssw0rd123
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
          example:
            - GUEST
            - HOST
        fullName:
          type: string
          maxLength: 100
          example: John Giggity Doe
        phoneNumber:
          type: string
          example: +573101234567
        birthDate:
          type: string
          format: date
          example: '1990-01-01'
        profilePicture:
          type: string
          format: uri
          example: https://example.com/profile.jpg
      required:
        - email
        - password
        - roles
        - fullName
        - phoneNumber
        - birthDate
        - profilePicture

    UserLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          example: P@ssw0rd123
      required:
        - email
        - password

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        code:
          type: string
          example: '123456'
        newPassword:
          type: string
          pattern: ^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!])(?=\S+$).{8,}$
          example: NewPassword123!
      required:
        - email
        - code
        - newPassword

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          example: OldPassword123!
        newPassword:
          type: string
          pattern: ^(?=.*\d)(?=.*\p{Ll})(?=.*\p{Lu})(?=.*[^\p{L}\d\s]).{8,}$
          example: NewPassword123!
      required:
        - currentPassword
        - newPassword

    CreateAccommodationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          example: Cabana familiar con vista al valle
        description:
          type: string
          maxLength: 1000
          example: Cabana campestre equipada para familias, con cocina integral, zona BBQ y vista panoramica al valle.
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          example: 6
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: COP
        pricePerNight:
          type: number
          format: double
          minimum: 0.01
          example: 180000.00
        mainImage:
          type: string
          format: uri
          example: https://images.example.com/accommodations/main/cabana-valle.jpg
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -75.6811
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 4.5339
        locationDescription:
          type: string
          maxLength: 100
          example: A 10 minutos del Parque del Cafe, sobre via principal pavimentada.
        city:
          type: string
          maxLength: 100
          example: Armenia
        images:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
            example: https://images.example.com/accommodations/gallery/cabana-valle-sala.jpg
      required:
        - title
        - description
        - capacity
        - currency
        - pricePerNight
        - mainImage
        - longitude
        - latitude
        - locationDescription
        - city
        - images

    CreateAccommodationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 15
        hostId:
          type: integer
          format: int64
          example: 8
        hostEmail:
          type: string
          format: email
          example: host@example.com
        title:
          type: string
          example: Cabana familiar con vista al valle
        description:
          type: string
          example: Cabana campestre equipada para familias, con cocina integral, zona BBQ y vista panoramica al valle.
        capacity:
          type: integer
          example: 6
        currency:
          type: string
          example: COP
        pricePerNight:
          type: number
          format: double
          example: 180000.00
        mainImage:
          type: string
          format: uri
          example: https://images.example.com/accommodations/main/cabana-valle.jpg
        longitude:
          type: number
          format: double
          example: -75.6811
        latitude:
          type: number
          format: double
          example: 4.5339
        locationDescription:
          type: string
          example: A 10 minutos del Parque del Cafe, sobre via principal pavimentada.
        city:
          type: string
          example: Armenia
        images:
          type: array
          items:
            type: string
            format: uri
        available:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-04-28T20:45:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-28T20:45:00'
      required:
        - id
        - hostId
        - hostEmail
        - title
        - description
        - capacity
        - currency
        - pricePerNight
        - mainImage
        - longitude
        - latitude
        - locationDescription
        - city
        - images
        - available
        - createdAt
        - updatedAt

    User:
      type: object
      description: Current serialized shape of the nested host object returned by the accommodation detail endpoint.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
