    CreateRentalPackageRequest:
      type: object
      description: Request body to create a seasonal pricing package for an accommodation.
      properties:
        startDate:
          type: string
          format: date
          description: First day (inclusive) on which the seasonal price is applied. Must be today or later.
          example: '2026-07-01'
        endDate:
          type: string
          format: date
          description: Last day (inclusive) on which the seasonal price is applied. Must be strictly after startDate.
          example: '2026-07-31'
        pricePerNight:
          type: number
          format: double
          description: Nightly price that replaces the accommodation base rate for reservation nights inside this date range.
          minimum: 0.01
          example: 150000.00
      required:
        - startDate
        - endDate
        - pricePerNight

    UpdateRentalPackageRequest:
      type: object
      description: Request body to partially update a seasonal pricing package. All fields are optional.
      properties:
        startDate:
          type: string
          format: date
          description: New first day (inclusive) on which the seasonal price is applied. Must be today or later if provided.
          example: '2026-08-01'
          nullable: true
        endDate:
          type: string
          format: date
          description: New last day (inclusive) on which the seasonal price is applied. Must be strictly after the effective startDate.
          example: '2026-08-31'
          nullable: true
        pricePerNight:
          type: number
          format: double
          description: New nightly price that replaces the accommodation base rate for nights inside the package range.
          minimum: 0.01
          example: 160000.00
          nullable: true

    RentalPackageResponse:
      type: object
      description: Response body representing a seasonal pricing package.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the rental package.
          example: 1
        accommodationId:
          type: integer
          format: int64
          description: ID of the accommodation this package belongs to.
          example: 15
        startDate:
          type: string
          format: date
          description: First day on which the seasonal price is applied (inclusive).
          example: '2026-07-01'
        endDate:
          type: string
          format: date
          description: Last day on which the seasonal price is applied (inclusive).
          example: '2026-07-31'
        pricePerNight:
          type: number
          format: double
          description: Nightly price that replaces the accommodation base rate for reservation nights inside the package range.
          example: 150000.00
        createdAt:
          type: string
          format: date-time
          example: '2026-05-04T10:00:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-04T12:30:00'
      required:
        - id
        - accommodationId
        - startDate
        - endDate
        - pricePerNight
        - createdAt
        - updatedAt
