<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            line-height: 1.6;
            color: #1d1d1f;
        }

        .email-container {
            max-width: 520px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .email-header {
            background: #1d1d1f;
            color: #ffffff;
            padding: 32px;
            text-align: center;
        }

        .email-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .email-body {
            padding: 36px 32px;
        }

        .notification-badge {
            display: inline-block;
            background: #f5e6e6;
            color: #8a1f1f;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .booking-details {
            background: #fafafa;
            border-radius: 16px;
            padding: 24px;
            margin: 24px 0;
            border: 1px solid #e5e5e5;
        }

        .detail-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            flex: 1;
            color: #6e6e73;
            font-size: 14px;
            font-weight: 600;
        }

        .detail-value {
            flex: 2;
            text-align: right;
            font-size: 15px;
            font-weight: 500;
        }

        .footer {
            background: #fafafa;
            padding: 24px 32px;
            text-align: center;
            color: #6e6e73;
            font-size: 14px;
            border-top: 1px solid #e5e5e5;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h2>Hola [[${hostName}]]</h2>
    </div>

    <div class="email-body">
        <div class="notification-badge">Reserva cancelada</div>

        <p>Una reserva de tu alojamiento fue cancelada.</p>

        <div class="booking-details">
            <div class="detail-item">
                <span class="detail-label">Huesped</span>
                <span class="detail-value">[[${guestName}]]</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Alojamiento</span>
                <span class="detail-value">[[${accommodationTitle}]]</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Check-in</span>
                <span class="detail-value">[[${startDate}]]</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Check-out</span>
                <span class="detail-value">[[${endDate}]]</span>
            </div>
        </div>
    </div>

    <div class="footer">
        StayHub
    </div>
</div>
</body>
</html>
